<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Adly Irsyad Hafizh</title>
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --bg-grad-3: #311042;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-glow: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), #0d0a21);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(0,0,0,0) 70%);
            top: 15%;
            left: 20%;
            border-radius: 50%;
            filter: blur(50px);
            animation: floatGlow 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, rgba(0,0,0,0) 70%);
            bottom: 15%;
            right: 20%;
            border-radius: 50%;
            filter: blur(50px);
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            perspective: 1000px;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 60px rgba(139, 92, 246, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 18px;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-cyan));
            animation: spinRing 6s linear infinite;
        }

        .avatar {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0f172a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            color: #ffffff;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }

        .name {
            font-size: 1.55rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #c084fc, #38bdf8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 4s linear infinite;
            margin-bottom: 6px;
        }

        .badge-sub {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
            letter-spacing: 0.5px;
        }

        /* Info List */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInRow 0.6s ease forwards;
        }

        .info-item:nth-child(1) { animation-delay: 0.2s; }
        .info-item:nth-child(2) { animation-delay: 0.35s; }
        .info-item:nth-child(3) { animation-delay: 0.5s; }
        .info-item:nth-child(4) { animation-delay: 0.65s; }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateX(4px);
        }

        .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .val {
            font-size: 0.92rem;
            color: #f1f5f9;
            font-weight: 600;
            text-align: right;
        }

        /* Skill Tags */
        .skills-section {
            opacity: 0;
            animation: fadeInRow 0.6s ease forwards 0.8s;
        }

        .skills-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 10px;
            background: rgba(6, 182, 212, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(6, 182, 212, 0.25);
            transition: all 0.3s ease;
            cursor: default;
        }

        .tag:hover {
            background: rgba(6, 182, 212, 0.25);
            border-color: #38bdf8;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeInRow 0.6s ease forwards 0.95s;
        }

        /* Keyframe Animations */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 40px); }
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar-ring"></div>
                    <div class="avatar">AIH</div>
                </div>
                <h1 class="name">Adly Irsyad Hafizh</h1>
                <span class="badge-sub">Teknik Komputer & Jaringan</span>
            </div>

            <div class="info-list">
                <div class="info-item">
                    <span class="label">Nama Lengkap</span>
                    <span class="val">Adly Irsyad Hafizh</span>
                </div>
                <div class="info-item">
                    <span class="label">Kelas</span>
                    <span class="val">XI TKJ 4</span>
                </div>
                <div class="info-item">
                    <span class="label">Sekolah</span>
                    <span class="val">SMK Taruna Bhakti Depok</span>
                </div>
                <div class="info-item">
                    <span class="label">Minat Karir</span>
                    <span class="val">Cloud Engineer</span>
                </div>
            </div>

            <div class="skills-section">
                <div class="skills-title">Keahlian & Bidang</div>
                <div class="skills-grid">
                    <span class="tag">Administrasi Jaringan</span>
                    <span class="tag">Linux / Debian</span>
                    <span class="tag">Docker</span>
                    <span class="tag">Cisco</span>
                </div>
            </div>

            <footer>
                &copy; 2026 Adly Irsyad Hafizh &bull; GitHub Profile
            </footer>
        </div>
    </div>

</body>
</html>

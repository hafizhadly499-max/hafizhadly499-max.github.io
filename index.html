<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Adly Irsyad Hafizh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #238636;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 15px auto;
            border: 3px solid #3fb950;
        }

        .profile-header h1 {
            font-size: 24px;
            color: #f0f6fc;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #8b949e;
            font-size: 14px;
        }

        .info-group {
            border-top: 1px solid #21262d;
            padding-top: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #21262d;
            font-size: 15px;
        }

        .info-label {
            color: #8b949e;
            font-weight: 500;
        }

        .info-value {
            color: #58a6ff;
            font-weight: 600;
        }

        .skills-title {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 16px;
            color: #f0f6fc;
        }

        .skills-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #1f6feb23;
            color: #58a6ff;
            border: 1px solid #1f6feb;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-header">
            <div class="avatar">AIH</div>
            <h1>Adly Irsyad Hafizh</h1>
            <p>Siswa Teknik Komputer & Jaringan</p>
        </div>

        <div class="info-group">
            <div class="info-item">
                <span class="info-label">Nama Lengkap</span>
                <span class="info-value">Adly Irsyad Hafizh</span>
            </div>
            <div class="info-item">
                <span class="info-label">Kelas</span>
                <span class="info-value">XI TKJ 4</span>
            </div>
            <div class="info-item">
                <span class="info-label">Sekolah</span>
                <span class="info-value">SMK Taruna Bhakti Depok</span>
            </div>
            <div class="info-item">
                <span class="info-label">Jurusan</span>
                <span class="info-value">TKJ</span>
            </div>
        </div>

        <div class="skills-title">Keahlian / Fokus:</div>
        <div class="skills-tags">
            <span class="tag">Jaringan Komputer</span>
            <span class="tag">MikroTik</span>
            <span class="tag">Linux</span>
            <span class="tag">HTML/CSS</span>
        </div>

        <footer>
            <p>&copy; 2026 Adly Irsyad Hafizh — GitHub Profile Page</p>
        </footer>
    </div>

</body>
</html>

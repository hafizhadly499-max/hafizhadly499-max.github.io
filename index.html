<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hafiz - Biodata</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  min-height:100vh;
  background: linear-gradient(135deg, #4a0e1e 0%, #7a1a2f 50%, #d8a0a8 100%);
  display:flex;justify-content:center;align-items:center;padding:20px;
}
.card{
  width:100%;max-width:380px;
  background:#fff8ee;
  border-radius:24px;
  overflow:hidden;
  border:3px solid #fff8ee;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
}
.top{
  background:#7a0f2a;
  padding:35px 20px 30px;
  text-align:center;
  position:relative;
}
.avatar{
  width:110px;height:110px;
  background:#fff3d9;
  border-radius:50%;
  margin:0 auto 15px;
  display:flex;justify-content:center;align-items:center;
  font-size:50px;
  border:4px solid #fff8ee;
}
.top h1{color:white;font-size:26px;letter-spacing:1px;font-weight:700}
.top p.sub{color:#f0c6c6;font-size:13px;margin-top:4px}
.badge{
  display:inline-block;
  background:#2b0a12;color:white;
  padding:4px 14px;border-radius:20px;
  font-size:11px;font-weight:600;margin-top:10px;
}
.cake{
  position:absolute;
  bottom:-16px;left:50%;transform:translateX(-50%);
  background:#fff8ee;
  padding:5px 18px;border-radius:20px;
  font-size:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}
.content{padding:35px 18px 20px;display:flex;flex-direction:column;gap:14px}
.item{
  background:white;
  border-radius:14px;
  padding:14px 16px;
  display:flex;gap:12px;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border-left:4px solid #7a0f2a;
}
.item .icon{font-size:18px}
.item .label{font-size:10px;color:#999;font-weight:600;letter-spacing:.5px}
.item .value{font-size:13.5px;color:#2b0a12;font-weight:600;margin-top:2px}
.bottom-box{
  background:#7a0f2a;
  border-radius:14px;
  padding:14px;
  text-align:center;
  color:white;
  margin-top:4px;
}
.bottom-box .title{font-weight:700;font-size:14px}
.bottom-box .desc{font-size:12px;font-style:italic;color:#f0c6c6;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="avatar">👨‍💻</div>
    <h1>HAFIZ</h1>
    <p class="sub">Daftar Chevron Kanan & Web Dev</p>
    <div class="badge">hafizhadly499</div>
    <div class="cake">🚀 ✨ 🔥</div>
  </div>
  <div class="content">
    <div class="item">
      <div class="icon">👤</div>
      <div><div class="label">NAMA LENGKAP</div><div class="value">Hafiz Hadly</div></div>
    </div>
    <div class="item">
      <div class="icon">🏫</div>
      <div><div class="label">KELAS / JURUSAN</div><div class="value">11 TKJ - Teknik Komputer & Jaringan</div></div>
    </div>
    <div class="item">
      <div class="icon">💻</div>
      <div><div class="label">KEAHLIAN / MINAT</div><div class="value">Web Design & Chevron Project</div></div>
    </div>
    <div class="item">
      <div class="icon">✨</div>
      <div><div class="label">HOBI</div><div class="value">Ngoding, Eksperimen Vercel & GitHub</div></div>
    </div>
    <div class="bottom-box">
      <div class="title">🔥 Favorite Vibe</div>
      <div class="desc">"Deploy tanpa beli domain tetap jalan!"</div>
    </div>
  </div>
</div>
</body>
</html>
